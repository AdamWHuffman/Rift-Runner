# Goal catalog. zone_weight_targets are [zone1, zone2, zone3, zone4, zone5]
# fractions of time, summing to ~1.0 -- the HR-zone distribution an activity
# "should" have to best serve that goal. Grounded in standard 5-zone exercise
# physiology: zones 1-3 are aerobic (zone 2 = classic "easy/base" pace, zone 3
# = aerobic tempo, still fully aerobic), zones 4-5 are where anaerobic
# metabolism dominates (zone 4 = threshold, zone 5 = max effort/sprint).
#
# Adding a new goal: add a row here, run seed_config.py.
- key: base_building
  display_name: Base Building
  description: >
    Build a sustainable aerobic base while minimizing injury risk -- ideal if
    you're mixing walking and running, or coming back from injury. Rewards
    time in zones 1-3 (all aerobic); zones 4-5 (anaerobic) are still allowed
    in brief bursts but aren't the focus.
  zone_weight_targets: [0.20, 0.35, 0.30, 0.10, 0.05]
  multiplier_min: 0.7
  multiplier_max: 1.3
- key: general_health
  display_name: General Health
  description: >
    Broad overall fitness and wellness -- rewards moderate-to-vigorous
    activity fairly evenly without over-rewarding maximal effort.
  zone_weight_targets: [0.05, 0.35, 0.35, 0.20, 0.05]
  multiplier_min: 0.7
  multiplier_max: 1.3
- key: endurance_building
  display_name: Endurance Building
  description: >
    Build the capacity to go longer -- rewards sustained aerobic effort
    (zones 2-3) slightly more than base_building, with a bit more room for
    tempo-paced work.
  zone_weight_targets: [0.10, 0.30, 0.35, 0.20, 0.05]
  multiplier_min: 0.7
  multiplier_max: 1.3
- key: performance_racing
  display_name: Performance / Racing
  description: >
    Training for race performance -- rewards harder efforts (zones 4-5:
    threshold and max-effort work) much more than the other goals, since
    that's what race-pace training actually requires.
  zone_weight_targets: [0.05, 0.10, 0.20, 0.35, 0.30]
  multiplier_min: 0.7
  multiplier_max: 1.3
